spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/testDb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1111}
    driver-class-name: org.postgresql.Driver


  cloud:
    discovery:
      client:
        simple:
          instances:
            driver-service:
              - uri: http://localhost:${wiremock.server.port}
            passenger-service:
              - uri: http://localhost:${wiremock.server.port}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  liquibase:
    enabled: true
    contexts: test

mapbox:
  api:
    routes:
      geocode: http://localhost:${wiremock.server.port}/search/geocode/v6/forward
      distance: http://localhost:${wiremock.server.port}/directions/v5/mapbox/driving/{coordinates}
    secret-key: test-token

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

logging:
  level:
    root: INFO
    com.vlad.kuzhyr.passengerservice: DEBUG
    org.springframework.cloud.openfeign: DEBUG
    com.github.tomakehurst.wiremock: DEBUG
