server:
  port: 5007

spring:
  profiles:
    active: dev
  application:
    name: ride-service
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  cloud:
    openfeign:
      client:
        config:
          default:
            retryer: feign.Retryer$Default
            connectTimeout: 5000
            readTimeout: 5000
            loggerLevel: full
  data:
    redis:
      port: 6379
      host: localhost

  kafka:
    bootstrap-servers: ${KAFKA_URL:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.LongSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      retries: 3
      acks: 1
      batch-size: 16384
      buffer-memory: 67108864
    topic:
      ride-completed-topic: ride.completed
      driver-busy-topic: driver.status.updated
      passenger-busy-topic: passenger.status.updated
    message:
      scheduler:
        fixed-rate: 3000

  cache:
    type: redis
    redis:
      time-to-live: 10000
      key-prefix: "ride-service:"
      use-key-prefix: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:${EUREKA_PORT:8761}/eureka}
    register-with-eureka: ${REGISTER_WITH_EUREKA:true}
    fetch-registry: ${EUREKA_FETCH_REGISTRY:true}

management:
  endpoints:
    web:
      exposure:
        include: "*"

springdoc:
  api-docs:
    path: /api/v1/api-docs
  swagger-ui:
    path: /api/v1/api-docs/swagger-ui.html

mapbox:
  api:
    routes:
      geocode: https://api.mapbox.com/search/geocode/v6/forward
      distance: https://api.mapbox.com/directions/v5/mapbox/driving/{coordinates}
    secret-key: ${MAPBOX_API_KEY}
