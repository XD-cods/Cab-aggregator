plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.3' apply false
    id 'io.spring.dependency-management' version '1.1.4'
    id 'checkstyle'
}

allprojects {
    apply plugin: 'io.spring.dependency-management'

    group = 'com.vlad.kuzhyr'
    version = '0.0.1'

    repositories {
        mavenCentral()
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:3.4.3"
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:2024.0.0"
        }
        dependencies {
            dependency 'net.logstash.logback:logstash-logback-encoder:7.3'
            dependency 'org.codehaus.janino:janino:3.1.12'
            dependency 'net.ttddyy.observation:datasource-micrometer-spring-boot:1.1.0'
        }
    }
}

allprojects {
    apply plugin: 'checkstyle'

    checkstyle {
        toolVersion = '10.14.1'
        configFile = file("${rootDir}/config/checkstyle.xml")
        ignoreFailures = false
        showViolations = true
    }

    tasks.withType(Checkstyle).configureEach {
        reports {
            xml.required = false
            html.required = false
        }
    }
}

subprojects {
    apply plugin: 'java'

    sourceCompatibility = '17'
    targetCompatibility = '17'

    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

    tasks.register('buildSkipTests') {
        group = 'build'
        description = 'Runs build with skipped tests (equivalent to: gradle build -x test)'

        doLast {
            exec {
                commandLine 'gradle', 'build', '-x', 'test'
            }
        }
    }

    dependencies {
        // Логирование и мониторинг
        implementation 'net.logstash.logback:logstash-logback-encoder'
        implementation 'org.codehaus.janino:janino'
        implementation 'io.micrometer:micrometer-registry-elastic'
        implementation 'io.micrometer:micrometer-tracing-bridge-otel'
        implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
        implementation 'io.opentelemetry:opentelemetry-sdk-extension-autoconfigure'
        implementation 'io.micrometer:micrometer-tracing'
        implementation 'net.ttddyy.observation:datasource-micrometer-spring-boot'

        // Lombok (основные зависимости)
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'

        // Добавляем Lombok для тестов
        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'

        // Для корректной работы Lombok с MapStruct (если используется)
        annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

        // Тестирование
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
    }
}