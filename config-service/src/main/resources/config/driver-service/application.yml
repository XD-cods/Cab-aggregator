spring:

  datasource:
    url: ${DRIVER_DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DRIVER_DB_USERNAME:postgres}
    password: ${DRIVER_DB_PASSWORD:1111}
    driver-class-name: ${DRIVER_DB_DRIVER:org.postgresql.Driver}

  kafka:
    bootstrap-servers: ${KAFKA_URL:localhost:9092}
    listener:
      observation-enabled: true
    consumer:
      group-id: driver-ride-group
      key-deserializer: org.apache.kafka.common.serialization.LongDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.apache.kafka.common.serialization.StringDeserializer

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml

springdoc:
  api-docs:
    path: /driver-service/v3/api-docs
  swagger-ui:
    path: /driver-service/swagger-ui.html
