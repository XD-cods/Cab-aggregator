name: Cab-aggregator
services:

  pgadmin:
    image: dpage/pgadmin4
    container_name: my_pgadmin
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "8089:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - cab-aggregator-application
    restart: always

  passenger_db:
    image: postgres:17-alpine
    ports:
      - "5436:5432"
    env_file:
      - .env
    volumes:
      - passenger-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${PASSENGER_DB_USERNAME}
      POSTGRES_PASSWORD: ${PASSENGER_DB_PASSWORD}
      POSTGRES_DB: ${PASSENGER_DB_NAME}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PASSENGER_DB_USERNAME} -d passenger_db" ]
      interval: 10s
      retries: 5
    networks:
      - cab-aggregator-application

  driver_db:
    image: postgres:17-alpine
    ports:
      - "5433:5432"
    env_file:
      - .env
    volumes:
      - driver-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DRIVER_DB_USERNAME}
      POSTGRES_PASSWORD: ${DRIVER_DB_PASSWORD}
      POSTGRES_DB: ${DRIVER_DB_NAME}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DRIVER_DB_USERNAME} -d driver_db" ]
      interval: 10s
      retries: 5
    networks:
      - cab-aggregator-application

  rating_db:
    image: postgres:17-alpine
    ports:
      - "5434:5432"
    env_file:
      - .env
    volumes:
      - rating-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${RATING_DB_USERNAME}
      POSTGRES_PASSWORD: ${RATING_DB_PASSWORD}
      POSTGRES_DB: ${RATING_DB_NAME}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${RATING_DB_USERNAME} -d rating_db" ]
      interval: 10s
      retries: 5
    networks:
      - cab-aggregator-application

  ride_db:
    image: postgres:17-alpine
    ports:
      - "5435:5432"
    env_file:
      - .env
    volumes:
      - ride-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${RIDE_DB_USERNAME}
      POSTGRES_PASSWORD: ${RIDE_DB_PASSWORD}
      POSTGRES_DB: ${RIDE_DB_NAME}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${RIDE_DB_USERNAME} -d ride_db" ]
      interval: 10s
      retries: 5
    networks:
      - cab-aggregator-application

  auth-db:
    image: postgres:17-alpine
    ports:
      - "5437:5432"
    env_file:
      - .env
    volumes:
      - auth-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${AUTH_DB_USERNAME}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
      POSTGRES_DB: ${AUTH_DB_NAME}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${AUTH_DB_USERNAME} -d auth_db" ]
      interval: 10s
      retries: 5
    networks:
      - cab-aggregator-application

  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"
    volumes:
      - redis-date:/data
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - cab-aggregator-application

  zookeeper:
    image: bitnami/zookeeper:latest
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    ports:
      - "2181:2181"
    healthcheck:
      test: nc -z localhost 2181 || exit -1
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - cab-aggregator-application

  kafka1:
    image: bitnami/kafka:3.4.1
    hostname: kafka1
    volumes:
      - kafka1-data:/bitnami/kafka
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_BROKER_ID=1
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_LISTENERS=PLAINTEXT://0.0.0.0:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka1:9092
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=3
      - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3
      - KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR=2
    healthcheck:
      test: kafka-topics.sh --bootstrap-server kafka1:9092 --list
      interval: 10s
      timeout: 15s
      retries: 3
    depends_on:
      zookeeper:
        condition: service_healthy
    networks:
      - cab-aggregator-application

  kafka2:
    image: bitnami/kafka:3.4.1
    hostname: kafka2
    volumes:
      - kafka2-data:/bitnami/kafka
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_BROKER_ID=2
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_LISTENERS=PLAINTEXT://0.0.0.0:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka2:9092
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
    healthcheck:
      test: kafka-topics.sh --bootstrap-server kafka2:9092 --list
      interval: 10s
      timeout: 15s
      retries: 3
    depends_on:
      zookeeper:
        condition: service_healthy
    networks:
      - cab-aggregator-application

  kafka3:
    image: bitnami/kafka:3.4.1
    hostname: kafka3
    volumes:
      - kafka3-data:/bitnami/kafka
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_BROKER_ID=3
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_LISTENERS=PLAINTEXT://0.0.0.0:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka3:9092
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
    healthcheck:
      test: kafka-topics.sh --bootstrap-server kafka3:9092 --list
      interval: 10s
      timeout: 15s
      retries: 3
    depends_on:
      zookeeper:
        condition: service_healthy
    networks:
      - cab-aggregator-application

  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    ports:
      - "9090:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: "local-cluster"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka1:9092,kafka2:9092,kafka3:9092"
      KAFKA_CLUSTERS_0_ZOOKEEPER: "zookeeper:2181"
      KAFKA_CLUSTERS_0_JMXPORT: 9999
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
    networks:
      - cab-aggregator-application

  config-server:
    image: config-server:latest
    build:
      context: ../config-server
      dockerfile: ../docker/Dockerfile
      args:
        - SERVICE_NAME=config-server
    env_file:
      - .env
    ports:
      - 8888:${CONFIG_SERVER_PORT}
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://config-server:${EUREKA_PORT}/actuator/health || exit 1
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks:
      - cab-aggregator-application

  eureka-server:
    image: eureka-server:latest
    build:
      context: ../eureka-server
      dockerfile: ../docker/Dockerfile
      args:
        - SERVICE_NAME=eureka-server
    env_file:
      - .env
    ports:
      - 8761:${EUREKA_PORT}
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://eureka-server:${EUREKA_PORT}/actuator/health || exit 1
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    depends_on:
      config-server:
        condition: service_healthy
      logstash:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - cab-aggregator-application

  passenger-service:
    image: passenger-service:latest
    build:
      context: ../passenger-service
      dockerfile: ../docker/Dockerfile
      args:
        - SERVICE_NAME=passenger-service
    env_file:
      - .env
    ports:
      - ${PASSENGER_SERVICE_PORT}:${PASSENGER_SERVICE_PORT}
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://passenger-service:${PASSENGER_SERVICE_PORT}/actuator/health || exit 1
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 5
    depends_on:
      passenger_db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
    networks:
      - cab-aggregator-application

  auth-service:
    image: auth-service:latest
    build:
      context: ../auth-service
      dockerfile: ../docker/Dockerfile
      args:
        - SERVICE_NAME=auth-service
    env_file:
      - .env
    ports:
      - ${AUTH_SERVICE_PORT}:${AUTH_SERVICE_PORT}
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://passenger-service:${PASSENGER_SERVICE_PORT}/actuator/health || exit 1
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 5
    depends_on:
      auth-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - cab-aggregator-application

  driver-service:
    image: driver-service:latest
    build:
      context: ../driver-service
      dockerfile: ../docker/Dockerfile
      args:
        - SERVICE_NAME=driver-service
    env_file:
      - .env
    ports:
      - ${DRIVER_SERVICE_PORT}:${DRIVER_SERVICE_PORT}
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://driver-service:${DRIVER_SERVICE_PORT}/actuator/health || exit 1
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 5
    depends_on:
      driver_db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
    networks:
      - cab-aggregator-application

  rating-service:
    image: rating-service:latest
    build:
      context: ../rating-service
      dockerfile: ../docker/Dockerfile
      args:
        - SERVICE_NAME=rating-service
    env_file:
      - .env
    ports:
      - ${RATING_SERVICE_PORT}:${RATING_SERVICE_PORT}
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://rating-service:${RATING_SERVICE_PORT}/actuator/health || exit 1
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 5
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      rating_db:
        condition: service_healthy
    networks:
      - cab-aggregator-application

  ride-service:
    image: ride-service:latest
    build:
      context: ../ride-service
      dockerfile: ../docker/Dockerfile
      args:
        - SERVICE_NAME=ride-service
    env_file:
      - .env
    ports:
      - ${RIDE_SERVICE_PORT}:${RIDE_SERVICE_PORT}
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://ride-service:${RIDE_SERVICE_PORT}/actuator/health || exit 1
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 5
    depends_on:
      ride_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
    networks:
      - cab-aggregator-application


  api-gateway:
    image: api-gateway:latest
    build:
      context: ../api-gateway
      dockerfile: ../docker/Dockerfile
      args:
        - SERVICE_NAME=api-gateway
    restart: on-failure
    env_file:
      - .env
    ports:
      - 8080:${API_GATEWAY_PORT}
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://api-gateway:${API_GATEWAY_PORT}/actuator/health || exit 1
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 5
    depends_on:
      eureka-server:
        condition: service_healthy
      passenger-service:
        condition: service_healthy
      driver-service:
        condition: service_healthy
      ride-service:
        condition: service_healthy
      rating-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks:
      - cab-aggregator-application

  elasticsearch:
    image: elasticsearch:7.9.1
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data/
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: curl -f http://elasticsearch:9200/_cluster/health || exit 1
      interval: 10s
      start_period: 45s
      timeout: 5s
      retries: 10
    networks:
      - cab-aggregator-application

  kibana:
    image: kibana:7.9.1
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
    volumes:
      - kb_data:/usr/share/kibana/data
    depends_on:
      - elasticsearch
    networks:
      - cab-aggregator-application

  logstash:
    image: logstash:7.9.1
    ports:
      - "5044:5044"
      - "9600:9600"
    volumes:
      - ./elk-config/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./elk-config/logstash/pipeline/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - ls_data:/usr/share/logstash/data
    environment:
      LS_JAVA_OPTS: "-Xmx256m -Xms256m"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9600"]
      interval: 20s
      timeout: 15s
      retries: 5
      start_period: 30s
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - cab-aggregator-application

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      - SPAN_STORAGE_TYPE=elasticsearch
      - ES_SERVER_URLS=http://elasticsearch:9200
      - LOG_LEVEL=info
      - COLLECTOR_OTLP_ENABLED=true
      - COLLECTOR_OTLP_HTTP_ENABLED=true
      - METRICS_BACKEND=none
      - JAEGER_DISABLED=true
    depends_on:
      - elasticsearch
    networks:
      - cab-aggregator-application

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: ${AUTH_DB_URL}
      KC_DB_USERNAME: ${AUTH_DB_USERNAME}
      KC_DB_PASSWORD: ${AUTH_DB_PASSWORD}
    ports:
      - "8088:8080"
    command:
      - start-dev
      - --import-realm
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - cab-aggregator-application

volumes:
  passenger-data:
  driver-data:
  rating-data:
  ride-data:
  redis-date:
  kafka-data:
  elasticsearch_data:
  ls_data:
  kb_data:
  auth-data:
  kafka3-data:
  kafka2-data:
  kafka1-data:
  keycloak_data:
  pgadmin_data:

networks:
  cab-aggregator-application:
    driver: bridge
