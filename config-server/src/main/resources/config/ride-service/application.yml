spring:

  datasource:
    url: ${RIDE_DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${RIDE_DB_USERNAME:postgres}
    password: ${RIDE_DB_PASSWORD:1111}
    driver-class-name: ${RIDE_DB_DRIVER:org.postgresql.Driver}

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${KEYCLOAK_CLIENT_ID:spring-auth-service}
            client-secret: ${KEYCLOAK_CLIENT_SECRET:tPoQfrdmyKpPi6EiVUIsiSOhPcnoVbxR}
            authorization-grant-type: client_credentials
            scope:
              - openid
              - profile
              - email
            provider: keycloak
        provider:
          keycloak:
            authorization-uri: ${keycloak.auth-server-url}/realms/${keycloak.realm}/protocol/openid-connect/auth
            token-uri: ${keycloak.auth-server-url}/realms/${keycloak.realm}/protocol/openid-connect/token
            user-info-uri: ${keycloak.auth-server-url}/realms/${keycloak.realm}/protocol/openid-connect/userinfo
            user-name-attribute: preferred_username

  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 5000
            readTimeout: 5000
            loggerLevel: full

  data:
    redis:
      port: ${REDIS_PORT:6379}
      host: ${REDIS_HOST:localhost}

  kafka:
    template:
      observation-enabled: true
    bootstrap-servers: ${KAFKA_URLS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.LongSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      retries: ${KAFKA_RETRIES:3}
      acks: 1
      batch-size: 16384
      buffer-memory: 67108864
    topic:
    message:
      scheduler:
        fixed-rate: ${MESSAGE_SCHEDULER_FIXED-RATE:1000}

  cache:
    type: redis
    redis:
      time-to-live: ${REDIS_TTL:3000}
      key-prefix: "ride-service:"
      use-key-prefix: true

resilience4j:
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 1s
        ignore-exceptions:
          - com.vlad.kuzhyr.rideservice.exception.CustomFeignException
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        failure-rate-threshold: 50
        minimum-number-of-calls: 10
        automatic-transition-from-open-to-half-open-enabled: true
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-size: 10
        sliding-window-type: COUNT_BASED
        ignore-exceptions:
          - com.vlad.kuzhyr.rideservice.exception.CustomFeignException
  timelimiter:
    configs:
      default:
        timeout-duration:
          seconds: 5

mapbox:
  api:
    routes:
      geocode: ${MAPBOX_GEOCODE_URL:https://api.mapbox.com/search/geocode/v6/forward}
    secret-key: ${MAPBOX_API_KEY}

springdoc:
  api-docs:
    path: /ride-service/v3/api-docs
  swagger-ui:
    path: /ride-service/swagger-ui.html

management:
  tracing:
    enabled: ${TRACING_ENABLED:true}
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${TEMPO_URL:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    prometheus:
      enabled: ${PROMETHEUS_ENABLED:true}
  metrics:
    tags:
      app: ${spring.application.name}
