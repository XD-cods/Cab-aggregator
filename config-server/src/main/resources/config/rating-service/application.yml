spring:

  datasource:
    url: ${RATING_DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${RATING_DB_USERNAME:postgres}
    password: ${RATING_DB_PASSWORD:1111}
    driver-class-name: ${RATING_DB_DRIVER:org.postgresql.Driver}

  kafka:
    bootstrap-servers: ${KAFKA_URLS:localhost:9092}
    listener:
      observation-enabled: true
    consumer:
      group-id: ride-rating-group
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring:
          deserializer:
            value:
              delegate:
                class: org.apache.kafka.common.serialization.StringDeserializer

rating:
  last:
    rides:
      count: ${RATING_LAST_RIDES_COUNT:20}

springdoc:
  api-docs:
    path: /rating-service/v3/api-docs
  swagger-ui:
    path: /rating-service/swagger-ui.html
