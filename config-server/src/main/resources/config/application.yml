keycloak:
  realm: ${KEYCLOAK_REALM:auth-service}
  auth-server-url: ${KEYCLOAK_URL:http://localhost:8088}

spring:
  kafka:
    topic:
      driver-create-topic: driver.create
      passenger-create-topic: passenger.create
      driver-busy-topic: driver.status.updated
      passenger-busy-topic: passenger.status.updated
      ride-completed-topic: ride.completed

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:${keycloak.auth-server-url}/realms/${keycloak.realm}}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:${EUREKA_PORT:8761}/eureka}
    register-with-eureka: ${REGISTER_WITH_EUREKA:true}
    fetch-registry: ${EUREKA_FETCH_REGISTRY:true}

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${JAEGER_URL:http://localhost:4318/v1/traces}

  endpoints:
    web:
      exposure:
        include: "*"
  elastic:
    metrics:
      export:
        enabled: ${ES_ENABLED:true}
        host: ${ES_HOST:http://localhost:9200}
        index: metrics
        step: ${ES_METRICS_STEP:10s}
        index-date-format: "yyyy.MM.dd"
        connect-timeout: ${ES_CONNECT_TIMEOUT:10s}

  metrics:
    tags:
      app: ${spring.application.name}
    distribution:
      percentiles:
        http:
          server:
            requests: 0.5, 0.9, 0.95, 0.99
      percentiles-histogram:
        http:
          server:
            request: true

logging:
  logstash:
    enabled: ${LOGSTASH_ENABLED:true}
    destination: ${LOGSTASH_DESTINATION:localhost:5044}

feign:
  driver-service:
    name: ${DRIVER_SERVICE_NAME:driver-service}
    path: ${DRIVER_SERVICE_PATH:/api/v1/drivers}
  passenger-service:
    name: ${PASSENGER_SERVICE_NAME:passenger-service}
    path: ${PASSENGER_SERVICE_PATH:/api/v1/passengers}