server:
  port: ${CONFIG_SERVER_PORT:8888}

spring:
  profiles:
    active: ${CONFIG_SERVER_PROFILE_ACTIVE:native}
  application:
    name: config-server
  cloud:
    config:
      server:
        native:
          searchLocations: "[classpath:/, classpath:/config, classpath:/config/{application}, classpath:/config/{application}/{application}-{profile}]"
        git:
          clone-on-start: true
          uri: ${GIT_URI}
          private-key: ${SSH_GIT_PRIVATE_KEY}
          ignore-local-ssh-settings: true
          force-pull: true
          search-paths: config

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus
