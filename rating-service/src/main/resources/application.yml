server:
  port: 5009

spring:
  profiles:
    active: dev
  application:
    name: rating-service

  jpa:
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_URL:localhost:9092}
    consumer:
      group-id: ride-rating-group
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring:
          deserializer:
            value:
              delegate:
                class: org.apache.kafka.common.serialization.StringDeserializer
    topic:
      ride-completed-topic: ride.completed

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:${EUREKA_PORT:8761}/eureka}
    register-with-eureka: ${REGISTER_WITH_EUREKA:true}
    fetch-registry: ${EUREKA_FETCH_REGISTRY:true}

management:
  endpoints:
    web:
      exposure:
        include: "*"

openapi:
  service:
    title: rating-service doc
    version: 1.0.0
    url: http://localhost:8080
springdoc:
  api-docs:
    path: /rating-service/v3/api-docs
  swagger-ui:
    path: /rating-service/swagger-ui.html

rating:
  last:
    rides:
      count: 20
