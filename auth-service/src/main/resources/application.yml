server:
  port: 8090

keycloak:
  realm: ${KEYCLOAK_REALM:auth-service}
  auth-server-url: ${KEYCLOAK_URL:http://localhost:8088}

spring:
  application:
    name: auth-service
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${KEYCLOAK_CLIENT_ID:spring-auth-service}
            client-secret: ${KEYCLOAK_CLIENT_SECRET:cmAklbQqdeVqEGzLZ5uJwKniOtI2kTIR}
            scope:
              - openid
              - profile
              - email

      resourceserver:
        jwt:
          issuer-uri: ${keycloak.auth-server-url}/realms/${keycloak.realm}

logging:
  level:
    root: debug