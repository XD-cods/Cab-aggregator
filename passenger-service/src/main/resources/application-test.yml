spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/testDb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1111}
    driver-class-name: org.postgresql.Driver
  cloud:
    config:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  liquibase:
    enabled: true
    contexts: test

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
